server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy a Citas / Atenciones
    location /api/atenciones/ {
        proxy_pass http://ms_appointments:8080/api/atenciones/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/appointments/ {
        proxy_pass http://ms_appointments:8080/api/atenciones/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy a Auditoría
    location /api/audit/ {
        proxy_pass http://ms_audit:8081/api/audit/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy a Catálogo de Prestaciones
    location /api/catalog/ {
        proxy_pass http://ms_catalog:8082/api/catalog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy a Notificaciones
    location /api/notify/ {
        proxy_pass http://ms_notify:8083/api/notify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy a Reportes
    location /api/report/ {
        proxy_pass http://ms_report:8084/api/report/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy a Administrador de RabbitMQ
    location /api/queues/ {
        proxy_pass http://ms_rabbitmq_admin:8085/api/queues/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy a Administrador de Kafka
    location /api/kafka/ {
        proxy_pass http://ms_kafka_admin:8086/api/kafka/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
